```html
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contacto | Mi página web</title>

    <!-- Iconos de Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        /* CONFIGURACIÓN GENERAL */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #f4f7f6, #dbeafe);
            min-height: 100vh;
            padding: 130px 20px 30px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* MENÚ SUPERIOR */
        header {
            width: 100%;
            position: absolute;
            top: 0;
            left: 0;
            padding: 10px;
        }

        .nav-capsulas {
            background-color: #0078d4;
            padding: 18px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            border-radius: 10px;
        }

        .nav-capsulas a {
            background-color: rgba(255, 255, 255, 0.18);
            color: white;
            text-decoration: none;
            padding: 10px 18px;
            border-radius: 50px;
            font-weight: 600;
            font-size: 0.95rem;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: 0.25s;
        }

        .nav-capsulas a:hover {
            background-color: #005ea6;
            transform: translateY(-3px);
        }

        /* CAJA DEL FORMULARIO */
        .form-container {
            background-color: white;
            width: 100%;
            max-width: 520px;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.10);
        }

        h2 {
            text-align: center;
            color: #1e293b;
            font-size: 1.8rem;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            font-size: 0.95rem;
            margin-bottom: 28px;
            line-height: 1.5;
        }

        /* CAMPOS DEL FORMULARIO */
        form {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label {
            font-size: 0.9rem;
            font-weight: 600;
            color: #334155;
        }

        input,
        textarea {
            width: 100%;
            padding: 12px 15px;
            border: 1.5px solid #cbd5e1;
            border-radius: 8px;
            font-size: 1rem;
            font-family: inherit;
            color: #0f172a;
            background-color: #f8fafc;
            outline: none;
            transition: 0.25s;
        }

        input:focus,
        textarea:focus {
            border-color: #0078d4;
            background-color: white;
            box-shadow: 0 0 0 4px rgba(0, 120, 212, 0.15);
        }

        textarea {
            resize: vertical;
            min-height: 130px;
        }

        /* BOTÓN DE ENVÍO */
        button {
            background: linear-gradient(135deg, #0078d4, #005ea6);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.25s;
            margin-top: 5px;
        }

        button:hover:not(:disabled) {
            background: #005ea6;
            transform: translateY(-2px);
        }

        button:disabled {
            background: #94a3b8;
            cursor: not-allowed;
        }

        /* MENSAJE DE RESPUESTA */
        #respuesta {
            display: none;
            padding: 12px;
            margin-top: 5px;
            border-radius: 8px;
            font-size: 0.95rem;
            text-align: center;
            line-height: 1.5;
        }

        #respuesta.exito {
            display: block;
            color: #166534;
            background-color: #dcfce7;
        }

        #respuesta.error {
            display: block;
            color: #991b1b;
            background-color: #fee2e2;
        }

        /* DISEÑO PARA CELULARES */
        @media (max-width: 600px) {
            body {
                padding: 190px 12px 25px;
            }

            .nav-capsulas {
                gap: 8px;
                padding: 12px;
            }

            .nav-capsulas a {
                padding: 9px 12px;
                font-size: 0.85rem;
            }

            .form-container {
                padding: 25px 20px;
            }
        }
    </style>
</head>

<body>

    <!-- MENÚ DE NAVEGACIÓN -->
    <header>
        <nav class="nav-capsulas">
          <a href="galeria .html"><i class="fa-solid fa-house"></i> galeria</a>
          <a href="index .html"><i class="fa-solid fa-house"></i> Inicio</a>
          <a href="sobre .html"><i class="fa-solid fa-envelope"></i> Sobre mi</a>
          <a href="contacto .html"><i class="fa-solid fa-envelope"></i> contacto</a>
          <a href="Proyectos.html"><i class="fa-solid fa-envelope"></i> Proyectos</a>
        </nav>
    </header>

    <!-- FORMULARIO DE CONTACTO -->
    <main class="form-container">

        <h2>Contáctame</h2>

        <p class="subtitle">
            Envíame un mensaje y te responderé lo antes posible.
        </p>

        <form id="formulario-contacto">

            <!-- CLAVE DE WEB3FORMS -->
            <input
                type="hidden"
                name="access_key"
                value="REEMPLAZA_CON_TU_ACCESS_KEY">

            <!-- ASUNTO DEL CORREO -->
            <input
                type="hidden"
                name="subject"
                value="Nuevo mensaje desde mi página web">

            <!-- NOMBRE -->
            <div class="input-group">

                <label for="nombre">Nombre completo</label>

                <input
                    type="text"
                    id="nombre"
                    name="name"
                    placeholder="Escribe tu nombre"
                    autocomplete="name"
                    required>

            </div>

            <!-- CORREO -->
            <div class="input-group">

                <label for="email">Correo electrónico</label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="tu@email.com"
                    autocomplete="email"
                    required>

            </div>

            <!-- MENSAJE -->
            <div class="input-group">

                <label for="mensaje">Mensaje</label>

                <textarea
                    id="mensaje"
                    name="message"
                    placeholder="Escribe tu mensaje aquí..."
                    required></textarea>

            </div>

            <!-- BOTÓN -->
            <button type="submit" id="boton-enviar">

                <i class="fa-solid fa-paper-plane"></i>
                Enviar mensaje

            </button>

            <!-- RESPUESTA DEL SERVICIO -->
            <p id="respuesta" role="status" aria-live="polite"></p>

        </form>

    </main>

    <!-- JAVASCRIPT PARA ENVIAR EL MENSAJE -->
    <script>
        const formulario = document.getElementById("formulario-contacto");
        const boton = document.getElementById("boton-enviar");
        const respuesta = document.getElementById("respuesta");

        formulario.addEventListener("submit", async function(evento) {

            // Evita que el navegador recargue la página.
            evento.preventDefault();

            // Comprueba que se haya configurado la clave.
            const clave = formulario.elements["access_key"].value.trim();

            if (!clave || clave === "REEMPLAZA_CON_TU_ACCESS_KEY") {
                respuesta.className = "error";
                respuesta.textContent =
                    "Error: primero debes colocar tu clave de Web3Forms.";
                return;
            }

            // Desactiva el botón mientras se envía el mensaje.
            boton.disabled = true;
            boton.innerHTML =
                '<i class="fa-solid fa-spinner fa-spin"></i> Enviando...';

            respuesta.className = "";
            respuesta.textContent = "";

            try {

                // Recoge los datos del formulario.
                const datos = new FormData(formulario);

                // Envía los datos a Web3Forms.
                const envio = await fetch(
                    "https://api.web3forms.com/submit",
                    {
                        method: "POST",
                        body: datos
                    }
                );

                // Lee la respuesta del servidor.
                const resultado = await envio.json();

                if (envio.ok && resultado.success) {

                    respuesta.className = "exito";
                    respuesta.textContent =
                        "¡Mensaje enviado correctamente! Gracias por contactarme.";

                    // Limpia los campos después del envío exitoso.
                    formulario.reset();

                } else {

                    respuesta.className = "error";
                    respuesta.textContent =
                        "No se pudo enviar el mensaje. " +
                        (resultado.message || "Revisa tu configuración de Web3Forms.");

                    console.error("Respuesta de Web3Forms:", resultado);
                }

            } catch (error) {

                respuesta.className = "error";
                respuesta.textContent =
                    "No se pudo conectar con el servicio. " +
                    "Revisa tu conexión a Internet e inténtalo nuevamente.";

                console.error("Error de conexión:", error);

            } finally {

                // Reactiva el botón.
                boton.disabled = false;
                boton.innerHTML =
                    '<i class="fa-solid fa-paper-plane"></i> Enviar mensaje';

            }

        });
    </script>

</body>
</html>
```
